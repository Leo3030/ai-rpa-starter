<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI RPA Starter</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="mark">AI</div>
        <div>
          <div class="title">AI RPA Starter</div>
          <div id="activeWorkflow" class="subtitle">加载中</div>
        </div>
      </div>
      <nav class="top-actions" aria-label="workflow actions">
        <button id="saveBtn" class="icon-button" title="保存">保存</button>
        <button id="undoBtn" class="icon-button compact" title="撤销">撤销</button>
        <button id="redoBtn" class="icon-button compact" title="重做">重做</button>
        <span class="toolbar-divider"></span>
        <button id="recordBtn" class="icon-button" title="流程录制">流程录制</button>
        <button id="dataBtn" class="icon-button" title="数据抓取">数据抓取</button>
        <button id="browserBtn" class="icon-button" title="打开浏览器">浏览器</button>
        <span class="toolbar-divider"></span>
        <button id="validateBtn" class="icon-button" title="校验">校验</button>
        <button id="runBtn" class="icon-button primary" title="运行">运行</button>
        <button id="debugBtn" class="icon-button" title="调试">调试</button>
        <button id="reloadBtn" class="icon-button" title="重载">重载</button>
      </nav>
      <div id="status" class="status">准备就绪</div>
    </header>

    <aside class="command-panel">
      <div class="panel-head">
        <strong>指令</strong>
        <input id="commandSearch" class="search" placeholder="搜索指令" />
      </div>
      <div class="segment">
        <button class="seg active" data-command-mode="standard" type="button">标准指令</button>
        <button class="seg" data-command-mode="ai" type="button">AI 指令</button>
      </div>
      <div id="commandList" class="command-list"></div>
    </aside>

    <main class="workspace">
      <div class="tabs">
        <button class="flow-tab active">主流程.flow</button>
        <button id="addNodeBtn" class="tab-plus" title="新增节点">＋</button>
      </div>
      <div class="flow-toolbar">
        <button id="moveUpBtn" class="mini-button" title="上移节点">上移</button>
        <button id="moveDownBtn" class="mini-button" title="下移节点">下移</button>
        <button id="toggleDisableNodeBtn" class="mini-button" title="禁用或启用选中节点">禁用</button>
        <button id="duplicateNodeBtn" class="mini-button" title="复制节点">复制</button>
        <button id="deleteNodeBtn" class="mini-button danger" title="删除节点">删除</button>
      </div>
      <div id="flowCanvas" class="flow-canvas"></div>
      <div class="bottom-dock">
        <div class="dock-tabs">
          <button data-tab="elements" class="dock-tab active">元素库</button>
          <button data-tab="agent" class="dock-tab">Agent 聊天</button>
          <button data-tab="logs" class="dock-tab">运行日志</button>
          <button data-tab="json" class="dock-tab">JSON</button>
        </div>
        <div id="elementsTab" class="dock-content active">
          <div class="element-toolbar">
            <button id="captureElementBtn" class="mini-button">从当前节点生成元素</button>
            <button id="deleteElementBtn" class="mini-button danger">删除选中元素</button>
          </div>
          <div id="elementList"></div>
        </div>
        <div id="agentTab" class="dock-content">
          <div id="agentMessages" class="agent-messages"></div>
          <form id="agentForm" class="agent-form">
            <input id="agentImageInput" class="hidden-file" type="file" accept="image/png,image/jpeg,image/webp" />
            <button id="agentImageBtn" class="mini-button" type="button">图片</button>
            <input id="agentInput" placeholder="告诉 Agent：添加、删除或调整节点" />
            <button id="agentSendBtn" class="wide-button" type="submit">发送</button>
          </form>
          <div id="agentImagePreview" class="agent-image-preview hidden"></div>
        </div>
        <div id="logsTab" class="dock-content"></div>
        <div id="jsonTab" class="dock-content">
          <textarea id="jsonEditor" spellcheck="false"></textarea>
        </div>
      </div>
    </main>

    <aside class="right-panel">
      <section class="right-section flow-tree-section">
        <div class="right-title">
          <strong>流程</strong>
          <button id="formatBtn" class="mini-button" title="格式化">格式化</button>
        </div>
        <div id="workflowList" class="workflow-list"></div>
        <div id="flowTree" class="flow-tree"></div>
      </section>

      <section class="right-section property-section">
        <div class="right-title"><strong>节点属性</strong></div>
        <div id="nodeEmpty" class="empty">选择一个节点后编辑属性</div>
        <form id="nodeForm" class="node-form hidden">
          <label>节点 ID<input id="nodeId" /></label>
          <label>标题<input id="nodeTitle" /></label>
          <label>类型<select id="nodeType"></select></label>
          <label>缩进层级<input id="nodeIndent" type="number" min="0" max="8" /></label>
          <label class="checkbox-label"><input id="nodeDisabled" type="checkbox" /> 暂时禁用这个节点</label>
          <label>参数 JSON<textarea id="nodeParams" spellcheck="false"></textarea></label>
          <button id="applyNodeBtn" class="wide-button" type="submit">应用到节点</button>
        </form>
      </section>
    </aside>
  </div>
  <section id="floatingLog" class="floating-log" aria-label="运行日志">
    <div id="floatingLogHead" class="floating-log-head">
      <div>
        <strong>Log Info</strong>
        <span id="floatingLogStatus">准备就绪</span>
      </div>
      <button id="logMinimizeBtn" class="mini-button" type="button">收起</button>
    </div>
    <div id="floatingLogBody" class="floating-log-body"></div>
  </section>
  <section id="mimoBlockingOverlay" class="blocking-overlay hidden" aria-live="assertive" aria-modal="true" role="alertdialog">
    <div class="blocking-dialog">
      <div class="blocking-mark">!</div>
      <h1>出错了，请联系管理员</h1>
      <p>应用已停止当前操作。请刷新应用后重新检查。</p>
    </div>
  </section>
  <script src="/static/app.js"></script>
</body>
</html>
